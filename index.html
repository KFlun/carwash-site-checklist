<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d5b3d">
  <title>熹红室｜自助洗车选址现场检查清单</title>
  <style>
    :root{--g:#0d5b3d;--line:#d8e5dc;--bg:#f3f7f4;--ink:#183126}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}input,textarea{width:100%;padding:10px;border:1px solid #cddbd1;border-radius:9px;background:#fff}.hidden{display:none!important}
    #gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#093d2a,#126945)}.gate-card{width:min(420px,100%);padding:26px;background:#fff;border-radius:22px;box-shadow:0 20px 70px #002a1b99}.gate-card>img{width:120px;height:54px;object-fit:contain;object-position:left}.gate-card h1{margin:14px 0 6px;font-size:26px}.gate-card p{font-size:13px;line-height:1.6;color:#63736a}.gate-card label,.meta label{display:grid;gap:6px;font-weight:700;margin-top:10px}.gate-card button,#export{width:100%;border:0;border-radius:10px;background:var(--g);color:#fff;padding:12px;margin-top:14px;font-weight:800}.gate-card .locate{background:#eaf4ed;color:var(--g);border:1px solid #bcd8c5}
    main{max-width:800px;margin:auto;padding-bottom:92px}.hero{display:grid;grid-template-columns:1fr auto;gap:12px;padding:23px 19px;color:#fff;background:linear-gradient(135deg,#0b402d,#126944);border-radius:0 0 25px 25px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:#c9e7d2}.hero h1{font-size:27px;line-height:1.2;margin:8px 0}.hero p{margin:0;font-size:14px;color:#d8ebdf}.brand{width:120px;text-align:center}.brand>.logo{width:115px;height:51px;object-fit:contain}.qrs{display:flex;gap:6px;justify-content:center}.qr{width:54px;padding:3px;border-radius:6px;background:#fff;color:#244234;font-size:8px;font-weight:700}.qr img{display:block;width:100%}.progress{grid-column:1/-1;padding:10px;border:1px solid #ffffff2d;border-radius:11px;font-size:12px}.progress b{font-size:21px}.track{height:6px;margin:7px 0;overflow:hidden;border-radius:6px;background:#ffffff33}.track i{display:block;width:0;height:100%;background:#d8ef75}.stats{display:flex;justify-content:space-between}
    .card,section{margin:13px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}.meta{padding:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}section h2{margin:0;padding:14px;border-bottom:1px solid var(--line);color:var(--g);font-size:16px}article{padding:13px;border-bottom:1px solid #edf1ee}article:last-child{border:0}article b{line-height:1.5}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.choice button{padding:7px;border:1px solid #d2e0d6;border-radius:8px;background:#fff;color:#607066}.pass{background:#edf8ef}.review{background:#fff8e9}.fail{background:#fff0ed}.on.pass{background:#d7efde!important;color:#087038!important}.on.review{background:#ffedc7!important;color:#986004!important}.on.fail{background:#ffdcd8!important;color:#a43b32!important}.foot{padding:14px}.foot h2{font-size:16px}.foot textarea{height:100px}.actions{position:fixed;z-index:5;right:0;bottom:0;left:0;display:flex;justify-content:center;gap:9px;padding:10px;background:#fffffff0;border-top:1px solid var(--line);backdrop-filter:blur(8px)}.actions button{padding:10px 14px;border:1px solid #cbded1;border-radius:10px;background:#fff;color:var(--g);font-weight:800}.actions #export{width:auto;margin:0;border:0}.watermark{display:none}
    @media(max-width:440px){.hero{grid-template-columns:1fr 100px}.brand{width:100px}.brand>.logo{width:96px}.qr{width:45px}.hero h1{font-size:24px}}
    @media print{@page{size:A4;margin:10mm}.actions{display:none}body{background:#fff}main{max-width:none;padding:0}.hero{padding:8mm;border-radius:0}.card,section{margin:5mm 0;break-inside:avoid;border-radius:8px}article{padding:7px}.choice{margin:5px 0}.choice button{padding:4px}.qrs{display:none}.watermark{position:fixed;inset:-12mm;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:52mm;gap:9mm 14mm;align-content:center;pointer-events:none;opacity:.09;transform:rotate(-45deg) scale(1.23)}.watermark div{display:flex;align-items:center;justify-content:center;gap:5px;color:var(--g);font-size:15px;font-weight:800}.watermark img{width:38px;height:25px;object-fit:contain}}

  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <img src="assets/xihongshi_red.png" alt="熹红室">
      <h1>开始前请登记</h1>
      <p>填写勘察人姓名与联系方式后进入；允许定位后，将自动预填详细地址。</p>
      <label>勘察人姓名<input id="gateName" placeholder="请输入姓名"></label>
      <label>联系方式<input id="gateContact" placeholder="手机号码或微信"></label>
      <button class="locate" id="locate">读取当前位置并填入地址</button>
      <p id="locationMessage">定位仅用于预填现场地址，可自行修改。</p>
      <button id="enter">进入检查清单</button>
    </div>
  </div>
  <main>
    <header class="hero">
      <div><div class="eyebrow">XIHONGSHI · SELF-SERVICE CAR WASH</div><h1>自助洗车选址<br>现场检查清单</h1><p>逐项记录、快速形成清晰的选址判断。</p></div>
      <div class="brand"><img class="logo" src="assets/xihongshi_red.png" alt="熹红室"><div class="qrs"><div class="qr"><img src="assets/founder-chengdu.jpg" alt="创始人微信二维码">李卓伦</div><div class="qr"><img src="assets/founder-hu.jpg" alt="创始人微信二维码">胡志远</div></div></div>
      <div class="progress"><b id="done">0</b> / <span id="total">0</span> 项已判断<div class="track"><i id="bar"></i></div><div class="stats"><span>通过 <b id="pass">0</b></span><span>待确认 <b id="review">0</b></span><span>不通过 <b id="fail">0</b></span></div></div>
    </header>
    <div class="card meta">
      <label>场地名称<input id="site" placeholder="例如：XX 路 XX 号临街铺"></label>
      <label>详细地址<input id="address" placeholder="读取定位或填写实际勘察地址"></label>
      <div class="split"><label>勘察人<input id="inspector"></label><label>联系方式<input id="contact"></label></div>
      <label>勘察日期<input id="date" type="date"></label>
    </div>
    <div id="list"></div>
    <div class="card foot"><h2>结论与待办</h2><textarea id="conclusion" placeholder="例如：建议推进；签约前落实排污接入方案，并核验产权及营业执照注册地址。"></textarea></div>
  </main>
  <div class="actions"><button id="clear">清空本次填写</button><button id="export">导出为 PDF</button></div>
  <div class="watermark" id="watermark"></div>
  <script>
    const data=[
      ['区位与客群',['8 公里内有大规模住宅区','8 公里内有产业园、办公区或稳定就业人群','8 公里内有商圈、商业街或高频消费场所','核心客群年龄以 40 岁以下为主']],
      ['客户动线与车辆通行',['从主路进入门店方便，转弯/掉头成本低','门头或入口清晰可见，容易被车主发现','有足够的排队等待位，不占用公共道路','出入口和内部路面宽敞，车辆会车、转弯顺畅','洗车后离场方便，不易造成回堵']],
      ['周边业态与环境',['附近无火锅、烧烤等重油烟/强异味业态','周边高峰期不易因餐饮、夜市等出现严重拥堵','周边环境整洁、安全，夜间照明与治安可接受']],
      ['扰民与合规风险',['与住宅、学校、医院等敏感点保持合理距离','洗车噪声、夜间营业不易引发投诉','物业、社区或管理方对洗车经营无明确限制','如涉及搭建集装箱或板房是否允许']],
      ['场地尺寸与布局',['场地面积满足计划洗车位和等候位需求','场地形状规整，可高效布置车位和设备','层高、雨棚/门头条件满足设备和运营需求','消防通道、设备区、收银区与车辆动线可同时满足']],
      ['水、电、排污',['有稳定供水，可满足高峰洗车用水量','电力容量、相数及增容条件满足设备需求','具备合法可接入的排水、污水处理条件','隔油沉砂、污水处理等设施的设置条件明确','水电排污接入、改造费用和责任已核实']],
      ['房租与经营测算',['月租/年租在项目测算可承受范围内','租期、续租权和租金递增条款可接受','押金、免租期、物业费及其他费用清晰','装修、设备安装和退租恢复责任已明确']],
      ['产权与营业执照',['出租方拥有正规产权或合法出租授权','可提供产权证明、租赁合同等材料','该地址可用于营业执照注册','房屋用途、规划及相关许可支持洗车经营']]
    ];
    const key='xhs-carwash-check-v1', $=id=>document.getElementById(id), state=JSON.parse(localStorage.getItem(key)||'{}');
    const list=$('list');
    data.forEach((section,si)=>{const el=document.createElement('section');el.innerHTML='<h2>0'+(si+1)+' · '+section[0]+'</h2>'+section[1].map((item,ii)=>'<article data-id="'+si+'-'+ii+'"><b>'+item+'</b><div class="choice"><button data-v="pass">通过</button><button data-v="review">待确认</button><button data-v="fail">不通过</button></div><input placeholder="现场备注 / 数据 / 证据"></article>').join('');list.appendChild(el)});
    const rows=[...document.querySelectorAll('article')], fields=['site','address','inspector','contact','date','conclusion'];
    $('total').textContent=rows.length;
    fields.forEach(id=>{$(id).value=state[id]||'';$(id).oninput=save});
    function setStatus(row,value){row.className=value;row.dataset.status=value;row.querySelectorAll('button').forEach(button=>button.className=button.dataset.v===value?'on '+value:'')}
    rows.forEach(row=>{row.querySelector('input').value=(state.notes||{})[row.dataset.id]||'';setStatus(row,(state.status||{})[row.dataset.id]||'');row.querySelector('input').oninput=save;row.querySelectorAll('button').forEach(button=>button.onclick=()=>{setStatus(row,button.dataset.v);save()})});
    function save(){const status={},notes={},count={pass:0,review:0,fail:0};rows.forEach(row=>{if(row.dataset.status){status[row.dataset.id]=row.dataset.status;count[row.dataset.status]++}notes[row.dataset.id]=row.querySelector('input').value});fields.forEach(id=>state[id]=$(id).value);state.status=status;state.notes=notes;localStorage.setItem(key,JSON.stringify(state));['pass','review','fail'].forEach(v=>$(v).textContent=count[v]);const finished=count.pass+count.review+count.fail;$('done').textContent=finished;$('bar').style.width=finished/rows.length*100+'%'}
    function fillAddress(lat,lon){$('address').value=lat.toFixed(6)+', '+lon.toFixed(6);$('locationMessage').textContent='已获取坐标，正在识别地址…';fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lon).then(response=>response.json()).then(result=>{$('address').value=result.display_name||$('address').value;$('locationMessage').textContent='定位地址已填入，可按现场情况修改。';save()}).catch(()=>{$('locationMessage').textContent='已填入坐标，请按现场补充地址。';save()})}
    $('locate').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(position=>fillAddress(position.coords.latitude,position.coords.longitude),()=>$('locationMessage').textContent='未取得定位权限，请手动填写地址。',{enableHighAccuracy:true,timeout:12000}):$('locationMessage').textContent='当前浏览器不支持定位，请手动填写地址。';
    $('enter').onclick=()=>{const name=$('gateName').value.trim(),contact=$('gateContact').value.trim();if(!name||!contact){$('locationMessage').textContent='请先填写姓名和联系方式。';return}$('inspector').value=name;$('contact').value=contact;if(!$('date').value)$('date').value=new Date().toISOString().slice(0,10);sessionStorage.setItem('xhs-gate','1');$('gate').classList.add('hidden');save()};
    if(sessionStorage.getItem('xhs-gate'))$('gate').classList.add('hidden');
    $('clear').onclick=()=>{if(confirm('确定清空本次填写内容吗？')){localStorage.removeItem(key);location.reload()}};
    $('export').onclick=()=>{const name=$('site').value.trim()||'未命名场地';document.title='熹红室自助洗车选址_'+name.replace(/[\\/:*?"<>|]/g,'_');window.print()};
    $('watermark').innerHTML=Array.from({length:12},()=>'<div><img src="assets/xihongshi_red.png"><span>熹红室</span></div>').join('');
    save();
  </script>
</body>
</html>
