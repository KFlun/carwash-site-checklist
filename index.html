<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自助洗车选址现场检查清单</title><style>
:root{--g:#146c45;--paper:#f4f7f4;--line:#dce5de;--muted:#68746d;--amber:#a76606;--red:#b13a31}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#17251f}main{max-width:760px;margin:auto;padding-bottom:130px}.hero{padding:24px 20px 26px;color:#fff;background:linear-gradient(145deg,#0d3e2b,#187a4e);border-radius:0 0 28px 28px}.brand{font-size:13px;font-weight:700;letter-spacing:.06em}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#bfe3cb;margin:24px 0 7px}.hero h1{font-size:31px;line-height:1.2;letter-spacing:-.04em;margin:0}.hero p{line-height:1.6;color:#d5eee0}.progress{padding:14px;border:1px solid #ffffff30;border-radius:14px;background:#ffffff17}.progress b{font-size:22px}.track{height:7px;background:#ffffff30;border-radius:99px;overflow:hidden;margin:10px 0}.track i{display:block;height:100%;background:#bced86;width:0}.summary{display:flex;justify-content:space-between;font-size:12px}.card{margin:14px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 3px 12px #10271b08}.meta{padding:16px;display:grid;gap:12px}.meta label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#526158}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:10px;border:1px solid #d6dfd9;border-radius:9px;background:#fff;color:#17251f}.hint{padding:12px 15px;color:var(--muted);font-size:12px}.section{overflow:hidden}.section-head{padding:17px 16px 13px;border-bottom:1px solid var(--line)}.section-head h2{font-size:17px;margin:0}.section-head p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}.item{padding:14px 16px;border-bottom:1px solid #edf0ed}.item:last-child{border:0}.item.pass{background:linear-gradient(90deg,#e8f4eb,#fff 45%)}.item.review{background:linear-gradient(90deg,#fff4dc,#fff 45%)}.item.fail{background:linear-gradient(90deg,#fff0ed,#fff 45%)}.item-title{font-size:14px;font-weight:700;line-height:1.5}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 8px}.buttons button{min-height:34px;border:1px solid #d6dfd9;border-radius:8px;background:#fff;color:#607067;font-size:12px;font-weight:700}.buttons button.on.pass{background:var(--g);border-color:var(--g);color:#fff}.buttons button.on.review{background:#f8c466;border-color:#f8c466;color:#764504}.buttons button.on.fail{background:var(--red);border-color:var(--red);color:#fff}.note{padding:8px 10px;font-size:12px;background:#fbfcfb}.conclusion{padding:16px}.conclusion h2{font-size:17px;margin:0 0 12px}.conclusion textarea{height:110px}.actions{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1.6fr;gap:9px;background:#fffffff2;border-top:1px solid #dbe5dd;backdrop-filter:blur(10px)}.actions button{min-height:45px;border-radius:11px;font-weight:800}.clear{background:#fff;border:1px solid #cfd9d2;color:#65736a}.export{background:var(--g);border:1px solid var(--g);color:#fff}.actions p{grid-column:1/-1;margin:0;text-align:center;color:#859189;font-size:11px}@media(min-width:760px){.hero{border-radius:28px}.card{margin-left:0;margin-right:0}}@media print{@page{size:A4;margin:11mm}body{background:#fff;font-size:10pt}main{max-width:none;padding:0}.hero{padding:0 0 8mm;background:#fff;color:#000;border-radius:0}.hero p,.eyebrow{color:#333}.hero h1{font-size:23pt}.progress{color:#000;background:#fff;border-color:#aaa}.track{background:#ddd}.track i{background:#555}.card{margin:5mm 0;border-color:#aaa;border-radius:0;box-shadow:none;break-inside:avoid}.meta{grid-template-columns:1fr 1fr}.meta label:first-child{grid-column:1/-1}.section-head{padding:3mm}.item{display:grid;grid-template-columns:1fr 27mm;gap:3mm;padding:3mm}.buttons{grid-column:2;grid-row:1;margin:0;display:block}.buttons button{display:none}.buttons button.on{display:block;width:100%;min-height:auto;padding:2mm;color:#000!important;background:#fff!important;border-color:#333!important}.note{grid-column:1/-1;margin-top:2mm;padding:2mm}.item:not(.pass):not(.review):not(.fail) .buttons:after{content:"未判断";display:block;text-align:center;color:#777}.conclusion{padding:3mm}.actions{display:none}}
</style></head><body><main><header class="hero"><div class="brand">洗 · 选址现场工具</div><div class="eyebrow">SELF-SERVICE CAR WASH</div><h1>自助洗车选址<br>现场检查清单</h1><p>逐项判断、记录现场证据，快速形成选址结论。</p><div class="progress"><b id="done">0</b> / <span id="total">0</span> 项已判断<div class="track"><i id="bar"></i></div><div class="summary"><span>通过 <b id="pass">0</b></span><span>待确认 <b id="review">0</b></span><span>不通过 <b id="fail">0</b></span></div></div></header><section class="meta card"><label>场地名称<input id="site" placeholder="例如：XX 路 XX 号临街铺"></label><label>详细地址<input id="address" placeholder="填写实际勘察地址"></label><div class="split"><label>勘察人<input id="inspector" placeholder="姓名"></label><label>勘察日期<input id="date" type="date"></label></div></section><div class="hint card">填写方式：每项选择“通过／待确认／不通过”，并在下方记录现场数据、照片线索或待办。</div><div id="list"></div><section class="conclusion card"><h2>结论与待办</h2><textarea id="conclusion" placeholder="例如：建议推进；签约前落实排污接入方案，并核验产权及营业执照注册地址。"></textarea></section></main><footer class="actions"><button class="clear" id="clear">清空本次填写</button><button class="export" id="export">导出为 PDF</button><p>填写内容自动保存在本机；导出后在打印窗口选择“另存为 PDF”。</p></footer><script>
const data=[
["1. 区位与客群","先确认周边是否有稳定、匹配的洗车需求。",["8 公里内有大规模住宅区","8 公里内有产业园、办公区或稳定就业人群","8 公里内有商圈、商业街或高频消费场所","核心客群年龄以 40 岁以下为主"]],
["2. 客户动线与车辆通行","车辆能看见、能进来、能等待、能顺畅离开。",["从主路进入门店方便，转弯/掉头成本低","门头或入口清晰可见，容易被车主发现","有足够的排队等待位，不占用公共道路","出入口和内部路面宽敞，车辆会车、转弯顺畅","洗车后离场方便，不易造成回堵"]],
["3. 周边业态与环境","避免油烟、异味、拥堵或客群冲突影响体验。",["附近无火锅、烧烤等重油烟/强异味业态","周边高峰期不易因餐饮、夜市等出现严重拥堵","周边环境整洁、安全，夜间照明与治安可接受"]],
["4. 扰民与合规风险","签约前确认噪声、排水和邻里投诉风险。",["与住宅、学校、医院等敏感点保持合理距离","洗车噪声、夜间营业不易引发投诉","物业、社区或管理方对洗车经营无明确限制"]],
["5. 场地尺寸与布局","实测为准，预留洗车位、等候位、设备和安全通道。",["场地面积满足计划洗车位和等候位需求","场地形状规整，可高效布置车位和设备","层高、雨棚/门头条件满足设备和运营需求","消防通道、设备区、收银区与车辆动线可同时满足"]],
["6. 水、电、排污","关键基础条件必须明确到接入点、容量和费用。",["有稳定供水，可满足高峰洗车用水量","电力容量、相数及增容条件满足设备需求","具备合法可接入的排水、污水处理条件","隔油沉砂、污水处理等设施的设置条件明确","水电排污接入、改造费用和责任已核实"]],
["7. 房租与经营测算","不仅看单价，也确认递增、免租、转让和改造责任。",["月租/年租在项目测算可承受范围内","租期、续租权和租金递增条款可接受","押金、免租期、物业费及其他费用清晰","装修、设备安装和退租恢复责任已明确"]],
["8. 产权与营业执照","产权和地址证明是经营落地的底线条件。",["出租方拥有正规产权或合法出租授权","可提供产权证明、租赁合同等材料","该地址可用于营业执照注册","房屋用途、规划及相关许可支持洗车经营"]]
];const key="carwash-checklist-v2";let state=JSON.parse(localStorage.getItem(key)||"{}");const list=document.getElementById("list");let n=0;data.forEach(function(s){let box=document.createElement("section");box.className="section card";box.innerHTML="<div class='section-head'><h2>"+s[0]+"</h2><p>"+s[1]+"</p></div>";s[2].forEach(function(t){n++;let id="i"+n;let row=document.createElement("article");row.className="item";row.dataset.id=id;row.innerHTML="<div class='item-title'>"+t+"</div><div class='buttons'><button data-v='pass'>通过</button><button data-v='review'>待确认</button><button data-v='fail'>不通过</button></div><input class='note' placeholder='现场备注 / 数据 / 证据'>";box.appendChild(row)});list.appendChild(box)});document.getElementById("total").textContent=n;["site","address","inspector","date","conclusion"].forEach(function(id){let el=document.getElementById(id);el.value=state[id]||"";el.oninput=save});document.querySelectorAll(".item").forEach(function(row){let id=row.dataset.id;let note=row.querySelector(".note");note.value=(state.notes||{})[id]||"";note.oninput=save;let v=(state.status||{})[id]||"";setStatus(row,v);row.querySelectorAll("button").forEach(function(btn){btn.onclick=function(){setStatus(row,btn.dataset.v);save()}})});function setStatus(row,v){row.className="item"+(v?" "+v:"");row.dataset.status=v;row.querySelectorAll("button").forEach(function(b){b.className=b.dataset.v===v?"on "+v:""})}function save(){let status={},notes={};document.querySelectorAll(".item").forEach(function(r){if(r.dataset.status)status[r.dataset.id]=r.dataset.status;notes[r.dataset.id]=r.querySelector(".note").value});state={status:status,notes:notes};["site","address","inspector","date","conclusion"].forEach(function(id){state[id]=document.getElementById(id).value});localStorage.setItem(key,JSON.stringify(state));let p=0,r=0,f=0;Object.keys(status).forEach(function(k){if(status[k]==="pass")p++;if(status[k]==="review")r++;if(status[k]==="fail")f++});document.getElementById("pass").textContent=p;document.getElementById("review").textContent=r;document.getElementById("fail").textContent=f;document.getElementById("done").textContent=p+r+f;document.getElementById("bar").style.width=((p+r+f)/n*100)+"%"}save();document.getElementById("clear").onclick=function(){if(confirm("确定清空本次填写内容吗？")){localStorage.removeItem(key);location.reload()}};document.getElementById("export").onclick=function(){document.title="自助洗车选址检查_"+(document.getElementById("site").value||"未命名场地");window.print()};
</script></body></html>
